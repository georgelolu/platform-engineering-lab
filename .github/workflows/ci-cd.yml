name: Platform Engineering CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:

  test:
    name: Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        working-directory: app
        run: |
          pytest -v


  docker-build-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}


  runner-test:
    name: Test EC2 Self-Hosted Runner
    runs-on: [self-hosted, linux, x64, nomad]
    needs: docker-build-push

    steps:
      - name: Check runner
        run: |
          echo "Running on EC2 self-hosted runner"
          echo "================================"
          echo "Hostname:"
          hostname

          echo "================================"
          echo "User:"
          whoami

          echo "================================"
          echo "Docker version:"
          docker --version

          echo "================================"
          echo "Nomad version:"
          nomad version

          echo "================================"
          echo "Nomad node status:"
          nomad node status

          echo "================================"
          echo "Runner test completed successfully!"


  deploy:
    name: Deploy to Nomad
    runs-on: [self-hosted, linux, x64, nomad]
    needs: runner-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy application to Nomad
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
        run: |
          echo "Deploying image:"
          echo "$IMAGE"

          nomad job run \
            -var="IMAGE=$IMAGE" \
            nomad/platform-demo.nomad

      - name: Verify Nomad deployment
        run: |
          echo "Waiting for Nomad deployment to become healthy..."

          for i in {1..12}; do
            STATUS=$(nomad job status platform-demo | awk '$1=="Status" {print $3}')

            echo "Attempt $i/12"
            echo "Job status: $STATUS"

            if [ "$STATUS" = "running" ]; then
              if nomad job status platform-demo | \
                awk '$1=="app" && $2=="1" && $3=="1" && $4=="1" && $5=="0" {found=1} END {exit !found}'
              then
                echo "Nomad deployment is healthy."
                break
              fi
            fi

            if [ "$i" -eq 12 ]; then
              echo "Nomad deployment did not become healthy."
              nomad job status platform-demo
              exit 1
            fi

            sleep 5
          done

      - name: Verify application through APISIX
        run: |
          echo "Testing application through APISIX..."

          RESPONSE=$(curl -fsS http://127.0.0.1/platform-demo/health)

          echo "Application response:"
          echo "$RESPONSE"

          if [ "$RESPONSE" != "healthy" ]; then
            echo "Application health check failed."
            exit 1
          fi

          echo "Application health check passed."

      - name: Verify application metrics
        run: |
          echo "Testing Prometheus metrics endpoint..."

          curl -fsS http://127.0.0.1:8080/metrics \
            | grep -q "platform_demo_requests_total"

          echo "Application metrics check passed."

      - name: Deployment verification successful
        run: |
          echo "=========================================="
          echo "DEPLOYMENT VERIFICATION SUCCESSFUL"
          echo "=========================================="
          echo "Application: platform-demo"
          echo "Image: ghcr.io/${{ github.repository }}:${{ github.sha }}"
          echo "Nomad: healthy"
          echo "APISIX: healthy"
          echo "Metrics: available"
          echo "=========================================="
