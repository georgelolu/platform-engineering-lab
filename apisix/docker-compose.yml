services:

  etcd:
    image: quay.io/coreos/etcd:v3.5.17
    container_name: apisix-etcd
    restart: unless-stopped

    command:
      - /usr/local/bin/etcd
      - --name=etcd
      - --data-dir=/etcd-data
      - --advertise-client-urls=http://172.18.0.2:2379
      - --listen-client-urls=http://0.0.0.0:2379

    ports:
      - "2379:2379"

    volumes:
      - etcd_data:/etcd-data

    networks:
      apisix_net:
        ipv4_address: 172.18.0.2


  apisix:
    image: apache/apisix:3.15.0-debian
    container_name: apisix
    restart: unless-stopped

    env_file:
      - .env

    depends_on:
      - etcd

    ports:
      - "80:9080"
      - "9180:9180"
      - "9443:9443"

    volumes:
      - ./config.yaml:/usr/local/apisix/conf/config.yaml

    networks:
      apisix_net:
        ipv4_address: 172.18.0.3


networks:
  apisix_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/16


volumes:
  etcd_data:
